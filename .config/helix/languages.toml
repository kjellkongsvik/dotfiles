[[language]]
name = "python"
auto-format = true
# language-servers = ["pyrefly", "ruff"]
language-servers = ["ty", "ruff"]

[[language]]
name = "markdown"
indent = { tab-width = 4, unit = "    " }

[language-server.jq]
command = "jq-lsp"

[[language]]
name = "json"
formatter = { command = "jq", args = ["--indent", "2"] }

[[language]]
name = "c-sharp"
language-servers = ["roslyn-language-server"]
auto-format = true
formatter = { command = "dotnet", args=["csharpier", "format"]}

[language-server.tsgo-lsp]
command = "npx"
args = ["tsgo", "--lsp", "--stdio"]

[[language]]
name = "typescript"
auto-format = true
language-servers = [
  "tsgo"
]

[[language]]
name = "toml"
scope = "source.toml"
injection-regex = "toml"
file-types = [
  "toml",
]
comment-token = "#"
language-servers = [ "taplo", "tombi" ]
indent = { tab-width = 4, unit = "  " }
