[language-server.ty]
command = "ty"
args = ["server"]

[language-server.pyrefly]
command = "pyrefly"
args = ["lsp"]

[[language]]
name = "python"
auto-format = true
# language-servers = ["pyrefly", "ruff"]
language-servers = ["ty", "ruff"]

[[language]]
name = "markdown"
indent = { tab-width = 4, unit = "    " }

[language-server.jq]
command = "jq-lsp"

[language-server.cs]
command = "jq-lsp"

[[language]]
name = "json"
formatter = { command = "jq", args = ["--indent", "2"] }

[[language]]
name = "c-sharp"
language-servers = ["roslyn-language-server"]
auto-format = true
formatter = { command = "dotnet", args=["csharpier", "format"]}
