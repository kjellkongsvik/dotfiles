[window]
decorations = "none"
startup_mode = "Maximized"
option_as_alt = "OnlyLeft"

[[hints.enabled]]
action = "Copy"
mouse = { enabled = true }
binding = { key = "L", mods = "Control|Shift" }
hyperlinks = true
regex = "[a-f0-9]{7,40}|(([.\\w\\-~\\$@]+)?(/[.\\w\\-@]+)+(\\:\\d)*(\\(\\d+,\\d+\\))*)|(---|\\+\\+\\+) [ab]/(?<match>.*)"

[colors.primary]
background = "#000000"
